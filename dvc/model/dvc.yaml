stages:
  train_new:
    wdir: ../..
    cmd: python cron/scripts/train.py --mode new
    deps:
      - centrales/REFERENCE/config-general.json
      - logs/dvc_markers/bv.json
      - logs/dvc_markers/validate.json
      - src/previ_r2d2/model/
      - cron/scripts/train.py
      - cron/scripts/build-data-preparation.py
    # Quotidien : ne traite que les dossiers sans AUCUN modèle en production
    # (nouvelle centrale) -- rafraîchit data_preparation.csv en interne, pour
    # CE dossier uniquement (cf. refresh_data_preparation dans train.py),
    # jamais via une dépendance DVC sur le marker global data_preparation.json
    # (qui rafraîchirait TOUTES les centrales, y compris celles qui
    # n'entraînent pas aujourd'hui -- coût évité). L'éligibilité (12 mois
    # d'historique) est calculée en interne à chaque exécution -- comme
    # debit (dvc/preprocessing/dvc.yaml), always_changed force ce check
    # quotidien même si les deps déclarées n'ont pas changé.
    always_changed: true
    outs:
      - logs/dvc_markers/train_new.json:
          cache: false

  train_monthly:
    wdir: ../..
    cmd: python cron/scripts/train.py --mode monthly
    deps:
      - centrales/REFERENCE/config-general.json
      - logs/dvc_markers/bv.json
      - logs/dvc_markers/validate.json
      - src/previ_r2d2/model/
      - cron/scripts/train.py
      - cron/scripts/build-data-preparation.py
    # Mensuel : réentraîne inconditionnellement tous les dossiers ayant déjà
    # un modèle en production (l'invocation mensuelle est l'échéance), promeut
    # seulement si meilleur (cf. promotion.py). Même rafraîchissement
    # data_preparation ciblé par dossier que train_new, en interne.
    always_changed: true
    outs:
      - logs/dvc_markers/train_monthly.json:
          cache: false
