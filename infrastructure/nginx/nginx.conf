# Reverse-proxy previ-R2-D2 (phase 07).
# Point d'entrée unique de la stack docker-compose : l'API en `/`, les UIs
# internes sous des préfixes. En k8s, ce rôle est tenu par l'Ingress nginx
# (cf. infrastructure/helm/previ-r2d2/templates/ingress.yaml).
#
# Résolution DNS paresseuse (resolver Docker + variables) : nginx démarre
# même si mlflow / grafana / prefect ne tournent pas encore, et résout les
# upstreams à la requête (502 propre plutôt que refus de démarrage).

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;      # DNS embarqué de Docker Compose

    client_max_body_size 5m;
    proxy_read_timeout 120s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        set $upstream_api "api:8000";
        proxy_pass http://$upstream_api;
    }

    location /mlflow/ {
        set $upstream_mlflow "mlflow:5000";
        proxy_pass http://$upstream_mlflow/;
    }

    location /grafana/ {
        set $upstream_grafana "grafana:3000";
        proxy_pass http://$upstream_grafana/;
    }

    location /prefect/ {
        set $upstream_prefect "prefect-server:4200";
        proxy_pass http://$upstream_prefect/;
    }
}
