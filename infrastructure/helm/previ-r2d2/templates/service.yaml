apiVersion: v1
kind: Service
metadata:
  name: {{ include "previ-r2d2.fullname" . }}
  labels:
    {{- include "previ-r2d2.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "previ-r2d2.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
