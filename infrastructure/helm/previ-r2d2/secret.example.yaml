# Secret attendu par le chart (values: existingSecret). À créer AVANT
# `helm install` — jamais versionner les vraies valeurs.
#
#   kubectl create secret generic previ-r2d2-secrets \
#     --from-literal=API_JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=AWS_ACCESS_KEY_ID=minioadmin \
#     --from-literal=AWS_SECRET_ACCESS_KEY=minioadmin \
#     --from-literal=MLFLOW_S3_ENDPOINT_URL=http://minio:9000
#
apiVersion: v1
kind: Secret
metadata:
  name: previ-r2d2-secrets
type: Opaque
stringData:
  API_JWT_SECRET: "change-me-32-bytes-minimum"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
