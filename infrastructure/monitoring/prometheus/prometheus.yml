global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: previ-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: previ-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring-exporter:9200"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
