# Airflow autonome pour la démo (bonus phase 08). Non intégré au
# docker-compose.yml principal — Airflow est lourd (webserver + scheduler +
# métabase). `previ-r2d2-base:latest` doit être construit au préalable
# (`docker compose build test` à la racine).
#
#   docker compose -f infrastructure/orchestration-alternatives/airflow/docker-compose.airflow.yml up
#   -> UI http://localhost:8081  (admin / admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    _PIP_ADDITIONAL_REQUIREMENTS: "pendulum"
  volumes:
    - ./dags:/opt/airflow/dags:ro
    # Le code + les scripts previ-R2-D2 montés dans /opt/previ (cf. DAGs).
    - ../../../src:/opt/previ/src:ro
    - ../../../cron:/opt/previ/cron:ro
    - ../../../centrales:/opt/previ/centrales
    - ../../../models:/opt/previ/models
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname a --lastname a --role Admin --email a@a.co || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
