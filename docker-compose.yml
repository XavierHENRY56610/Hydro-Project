name: previ-r2d2

# Un service par phase MLOps, dans ce même fichier.
#  Phase 00 : base + trainer + test
#  Phase 01 : mlflow + mlflow-db + minio (+ trainer branché dessus)
#  Phase 03 : api (FastAPI, charge le modèle @production depuis MLflow)

x-app-env: &app-env
  PREVI_MNT: ${PREVI_MNT:-}
  PREVI_NAS_METEO: ${PREVI_NAS_METEO:-}
  PREVI_PUISSANCE_SOURCE_ROOT: ${PREVI_PUISSANCE_SOURCE_ROOT:-}
  DAGSHUB_USER: ${DAGSHUB_USER:-}
  DAGSHUB_TOKEN: ${DAGSHUB_TOKEN:-}
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-previ-r2d2}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-previ-r2d2@localhost}

# Identifiants S3 (MinIO) — communs à MLflow et aux clients (trainer).
x-minio-env: &minio-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_DEFAULT_REGION: eu-west-1

x-common: &common
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.base
  image: previ-r2d2-base:latest
  working_dir: /app
  volumes:
    - ./src:/app/src
    - ./cron:/app/cron
    - ./tests:/app/tests
    - ./dvc:/app/dvc
    - ./config:/app/config
    - ./run.py:/app/run.py
    - ./pyproject.toml:/app/pyproject.toml
    - ./centrales:/app/centrales
    - ./models:/app/models
    - ./weights:/app/weights
    - ./outputs:/app/outputs
    - ./logs:/app/logs
    - ./.git:/app/.git
    - ./.dvc:/app/.dvc
    - ./.dvcignore:/app/.dvcignore

services:
  trainer:
    <<: *common
    environment:
      <<: [*app-env, *minio-env]
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    depends_on:
      mlflow:
        condition: service_healthy
    command:
      - python
      - -c
      - "print('previ-r2d2 trainer prêt — docker compose run --rm trainer <commande>')"

  test:
    <<: *common
    profiles: ["test"]
    environment: *app-env      # PAS de MLFLOW_TRACKING_URI : tracking no-op en test
    command: ["python", "-m", "pytest", "-q"]

  api:
    <<: *common
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: previ-r2d2-api:latest
    environment:
      <<: [*app-env, *minio-env]
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      API_AUTH_REQUIRED: ${API_AUTH_REQUIRED:-false}
      API_JWT_SECRET: ${API_JWT_SECRET:-}
      API_MODEL_SOURCE: ${API_MODEL_SOURCE:-auto}
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    command:
      - uvicorn
      - previ_r2d2.serving.api:app
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      echo 'bucket mlflow-artifacts prêt'
      "

  mlflow:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.mlflow
    image: previ-r2d2-mlflow:latest
    ports:
      - "5000:5000"
    environment: *minio-env
    depends_on:
      mlflow-db:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://mlflow:mlflow@mlflow-db:5432/mlflow
      - --artifacts-destination=s3://mlflow-artifacts/
      - --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  # --- Phase 05 : orchestration Prefect --------------------------------
  prefect-server:
    <<: *common
    environment:
      PREFECT_HOME: /data
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://localhost:4200/api
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/data
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4200/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    <<: *common
    environment:
      <<: [*app-env, *minio-env]
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_FAILURE_WEBHOOK: ${PREFECT_FAILURE_WEBHOOK:-}
    depends_on:
      prefect-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: ["python", "-m", "previ_r2d2.orchestration.serve"]

  # --- Phase 06 : monitoring & alerting -------------------------------
  monitoring-exporter:
    <<: *common
    environment: *app-env
    command: ["python", "-m", "previ_r2d2.monitoring.exporter"]
    ports:
      - "9200:9200"

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    # Docker Desktop (WSL2) refuse le bind `/:/host:ro,rslave` : on lit /proc
    # et /sys du conteneur (= la VM Docker), suffisant pour un dashboard infra.
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "9100:9100"

volumes:
  mlflow_db:
  minio_data:
  prefect_data:
  prometheus_data:
  grafana_data:
